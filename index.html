<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سوق الغنم 2.0 — المنصة السعودية المتخصصة لإعلانات المواشي</title>
    <meta name="description" content="منصة سعودية متخصصة في إعلانات المواشي، تربط المربين والبائعين والمشترين بتجربة احترافية للبحث عن النعيمي والنجدي والحري والعارضي." />
    <meta property="og:title" content="سوق الغنم 2.0 — المنصة السعودية المتخصصة لإعلانات المواشي" />
    <meta property="og:description" content="منصة سعودية متخصصة في إعلانات المواشي، تربط المربين والبائعين والمشترين بتجربة استخدام احترافية باللغة العربية." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('souq-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
